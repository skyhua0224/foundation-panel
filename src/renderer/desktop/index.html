<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundation Desktop</title>
    <meta name="description" content="Foundation Desktop 桌面控制面板">
    <link rel="icon" type="image/png" href="/src/assets/sunshine.ico">
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
    <style>
      /* 防止加载时闪烁：先按系统浅/深色给一个中性底，外观加载后由 foundation-ui 接管 */
      html, body {
        margin: 0;
        padding: 0;
        background: #fef7ff;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #141218; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunshine Control Panel</title>
    <script>
      ;(() => {
        const savedTheme = localStorage.getItem('sunshine-theme')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'

        document.documentElement.setAttribute('data-bs-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* the Material 3 surface of the shell before its first frame (the colour the window reports: src-tauri/src/windows/surface.rs) */
      :root {
        --boot-background: #131318;
      }

      :root[data-bs-theme='light'] {
        --boot-background: #fbf8ff;
      }

      body {
        overflow: hidden;
        background: var(--boot-background);
      }

      #app {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./sunshine-frame.js"></script>
  </body>
</html>

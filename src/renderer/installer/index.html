<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Foundation Sunshine</title>
    <style>
        /* a transparent window: the page draws the rounded surface and its shadow (MInstaller windowed); nothing is painted before it, so no white frame */
        html, body { width: 100vw; height: 100vh; margin: 0; overflow: hidden; overscroll-behavior: none; background: transparent; user-select: none; -webkit-user-select: none; cursor: default; }
        #app { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>

[workspace]
resolver = "2"
members = [
  "plugin-api",
  "stylus",
]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "debuginfo"

# CI tests do not need thin LTO or one codegen unit. Sources: panel-cargo-profiles,
# panel-cargo-test-profile.
[profile.ci-test]
inherits = "release"
opt-level = 1
debug = 0
incremental = false
codegen-units = 16
lto = false

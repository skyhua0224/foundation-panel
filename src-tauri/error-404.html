<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sunshine 没有响应</title>
    <style>
        /* the control panel's own tokens (Material 3 scheme of its brand colour), light and dark from the system */
        :root {
            --surface: #f3efff; --surface-container: #ece8fb; --card: #fbf9ff; --on-surface: #1c1b2d; --on-surface-variant: #4b4a63;
            --primary: #3441dc; --on-primary: #ffffff; --secondary-container: #dcdcff; --on-secondary-container: #1b1c58; --outline-variant: #c7c5e0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #14131f; --surface-container: #1e1d2c; --card: #242336; --on-surface: #e6e3f7; --on-surface-variant: #c6c4dc;
                --primary: #b9bfff; --on-primary: #1a2178; --secondary-container: #3b3d6b; --on-secondary-container: #dfe0ff; --outline-variant: #474662;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            background: var(--surface); color: var(--on-surface);
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
        }
        .container { width: min(100%, 520px); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
        .vivi { width: 124px; height: auto; margin-bottom: 4px; animation: float 3.2s ease-in-out infinite; user-select: none; }
        @keyframes float { 50% { transform: translateY(-8px); } }
        @media (prefers-reduced-motion: reduce) { .vivi { animation: none; } }
        h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.3; }
        .message { font-size: 1.05rem; line-height: 1.5; color: var(--on-surface-variant); }
        .tips { width: 100%; background: var(--card); border-radius: 28px; padding: 14px 20px 16px; text-align: left; }
        .tips h3 { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
        .tips h3 svg { width: 20px; height: 20px; fill: var(--primary); flex: none; }
        .tips ul { list-style: none; display: flex; flex-direction: column; gap: 6px; color: var(--on-surface-variant); font-size: .95rem; line-height: 1.4; }
        .tips li { padding-left: 4px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 28px; border: 0; border-radius: 22px; cursor: pointer;
            background: var(--primary); color: var(--on-primary); font: 600 1rem/1 inherit; font-family: inherit; transition: border-radius .2s ease, filter .2s ease;
        }
        .btn:hover { filter: brightness(1.08); } .btn:active { border-radius: 14px; }
        .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
        .tips li { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
        .tip-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--secondary-container); }
        .tip-ic svg { width: 18px; height: 18px; fill: var(--on-secondary-container); }
        .wait { display: flex; align-items: center; justify-content: center; gap: 14px; position: relative; min-height: 48px; }
        .ring { width: 44px; height: 44px; flex: none; transform: rotate(-90deg); }
        .ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
        .ring-track { stroke: var(--outline-variant); }
        .ring-arc { stroke: var(--primary); stroke-dasharray: 113.1; stroke-dashoffset: 113.1; transition: stroke-dashoffset .9s linear; }
        .ring.spin { animation: spin 1.1s linear infinite; }
        .ring.spin .ring-arc { stroke-dashoffset: 80; transition: none; }
        @keyframes spin { to { transform: rotate(270deg); } }
        .wait-num { position: absolute; left: 0; width: 44px; text-align: center; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .wait-text { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; }
        .wait-text b { font-size: .95rem; font-weight: 600; }
        .wait-text span { font-size: .85rem; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
        .btn svg { width: 20px; height: 20px; fill: currentColor; }
        .btn[disabled] { opacity: .72; cursor: progress; }
        .btn.busy svg { animation: spin2 1s linear infinite; }
        @keyframes spin2 { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .ring.spin, .btn.busy svg { animation: none; } .ring-arc { transition: none; } }
        .footer { font-size: .9rem; color: var(--on-surface-variant); min-height: 1.4em; font-variant-numeric: tabular-nums; }
    </style>
</head>

    <script>
        // 三阶段自动重试策略
        // 阶段1: 前10秒每秒探测（快速重连）
        // 阶段2: 第2-5轮每5秒探测
        // 阶段3: 之后每30秒探测
        const footerEl = document.getElementById('footer-text');
        const headEl = document.getElementById('wait-head');
        const numEl = document.getElementById('wait-num');
        const ringEl = document.getElementById('ring');
        const arcEl = document.getElementById('ring-arc');
        const retryEl = document.getElementById('retry');
        const retryLabel = document.getElementById('retry-label');
        const CIRC = 113.1;
        const PHASE1_DURATION = 10;
        const PHASE2_INTERVAL = 5;
        const PHASE2_ROUNDS = 4;
        const PHASE3_INTERVAL = 30;
        const BACK = 'Sunshine 恢复后，这个页面会自动返回。';
        let roundCount = 0;
        let countdown = 0;
        let interval = 0;
        let countdownTimer = null;
        // the ring is the wait: turning while a probe is out, filling down second by second until the next one
        function showProbing(text) {
            headEl.textContent = text; footerEl.textContent = BACK; numEl.textContent = '';
            ringEl.classList.add('spin');
            retryEl.disabled = true; retryEl.classList.add('busy'); retryLabel.textContent = '正在探测…';
        }
        function showWaiting() {
            ringEl.classList.remove('spin');
            arcEl.style.strokeDashoffset = String(CIRC * (1 - countdown / interval));
            numEl.textContent = String(countdown);
            headEl.textContent = `第${roundCount - 1}次探测失败`;
            footerEl.textContent = `${countdown}秒后重试…`;
            retryEl.disabled = false; retryEl.classList.remove('busy'); retryLabel.textContent = '再试一次';
        }
        async function probe(timeoutMs) {
            try {
                const resp = await fetch(location.origin + '/', {
                    method: 'GET', cache: 'no-store',
                    signal: AbortSignal.timeout(timeoutMs || 5000)
                });
                return resp.status !== 503 && resp.status !== 502;
            } catch { return false; }
        }
        function onSuccess() {
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
            ringEl.classList.remove('spin'); arcEl.style.strokeDashoffset = '0'; numEl.textContent = '';
            headEl.textContent = 'Sunshine 已恢复，正在返回…'; footerEl.textContent = '';
            retryEl.disabled = true; retryLabel.textContent = '正在返回…';
            setTimeout(() => location.reload(), 300);
        }
        function scheduleNextRound() {
            roundCount++;
            interval = roundCount <= 1 + PHASE2_ROUNDS ? PHASE2_INTERVAL : PHASE3_INTERVAL;
            countdown = interval;
            showWaiting();
            countdownTimer = setInterval(() => {
                if (--countdown <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    normalProbe();
                } else {
                    showWaiting();
                }
            }, 1000);
        }
        // phase 1: ten seconds of one probe a second (1 s timeout, so the total stays bounded)
        async function phase1() {
            roundCount = 1;
            for (let i = 0; i < PHASE1_DURATION; i++) {
                showProbing('第1次探测 Sunshine…');
                if (await probe(1000)) return onSuccess();
                if (i < PHASE1_DURATION - 1) await new Promise(r => setTimeout(r, 1000));
            }
            scheduleNextRound();
        }
        async function normalProbe() {
            showProbing(`第${roundCount}次探测 Sunshine…`);
            if (await probe()) return onSuccess();
            scheduleNextRound();
        }
        retryEl.addEventListener('click', () => {
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
            roundCount = 0;
            phase1();
        });
        phase1();
    </script>
</body>

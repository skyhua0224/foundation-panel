[package]
name = "sunshine-gui"
version = "0.0.0-dev"
description = "A GUI for sunshine"
authors = ["qiin2333"]
license = "MIT"
repository = "https://github.com/qiin2333/sunshine"
edition = "2024"

# The release profile follows the Cargo profile reference: size optimisation,
# whole-program LTO and one codegen unit. Keep panic handling at Cargo's
# default for this application. No `strip`: on the MSVC target it makes rustc
# pass /DEBUG:NONE to the linker, so no PDB is written and the crash reports
# (module + offset frames) could not be decoded. The PDB is a separate file
# and does not add to the size of the executable; CI archives it.
# Sources: panel-cargo-profiles
[profile.release]
# file and line tables in the PDB (not in the exe), so archived symbols resolve crash frames, also inlined ones under fat LTO
debug = "line-tables-only"
opt-level = "s"
lto = "fat"
codegen-units = 1

# CI tests only. The shipped binary above keeps size optimisation and whole-program LTO; tests
# do not need either (the 2026-11-22 run spent 11 min 34 s compiling and 11 s running 768 tests).
# Inheriting release keeps debug assertions and the test behaviour of the old release-profile
# runs; opt-level 1 keeps the timing-sensitive tests close to release speed while debug info and
# incremental artefacts are not built. Sources: panel-cargo-profiles, panel-cargo-test-profile.
[profile.ci-test]
inherits = "release"
opt-level = 1
debug = 0
incremental = false
codegen-units = 16
lto = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tauri = { version = "~2.12.4", features = ["test"] }

[dependencies]
tauri = { version = "~2.12.4", features = [ "tray-icon", "native-tls-vendored", "devtools" ] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.28", features = ["json", "native-tls", "stream", "gzip", "deflate"], default-features = false }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
wmi = "0.18"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1.11.3"
fancy-regex = "0.14"
flate2 = "1.1"
base64 = "0.22.1"
rcgen = "0.13"
chrono = { version = "0.4.43", features = ["serde"] }
url = "2.5.8"
dirs = "6.0"
futures-util = "0.3.31"
bytes = "1.11"
log = "0.4"
env_logger = "0.11.8"
raw-window-handle = "0.6"
xcap = "0.7"
clipboard-rs = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3.27"
alkaidlab-native-tool-plugin-api = { path = "../native-plugins/plugin-api" }
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# 内测功能：打包时包含测试功能（如 Web 串流）
beta = []

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
clipboard-win = "5.4"
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    # Required by windows-rs for ShellExecuteExW/SHELLEXECUTEINFOW.
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Credential Manager：CDK 的安全存储（CredWriteW/CredReadW/CredDeleteW）。
    "Win32_Security_Credentials",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "UI_ViewManagement",
    "Devices_Enumeration",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_ToolHelp",
    # crash capture: MiniDumpWriteDump, RtlVirtualUnwind, SetUnhandledExceptionFilter
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Performance",
    "Win32_System_Recovery",
    "Win32_System_WinRT",
    "Win32_Devices_DeviceAndDriverInstallation",
    # DisplayConfigGet/SetDeviceInfo: the per-display scale (dpi_scale.rs)
    "Win32_Devices_Display",
] }
# WebView2 COM 接口，用于访问 ICoreWebView2Settings4 等高级设置
webview2-com = "0.39"
# Match the WebView2 bindings used by wry 0.57 and their Interface trait.
wv2-windows-core = { package = "windows-core", version = "0.62" }
windows-collections = "0.3"
winreg = "0.55"
# Decoders for the formats the application meets: PNG (clipboard, updater
# sheet, DPI cover), BMP, JPEG, ICO (tray icons), plus GIF and WebP so a custom
# tray image or a pasted web image still decodes. The default AVIF encoder and
# the EXR, TIFF, HDR, DDS, farbfeld, PNM, QOI and TGA codecs are left out: nothing
# in the panel reads or writes them. Sources: panel-image-features, panel-image-avif (feature flags),
# panel-cargo-features (feature unification).
image = { version = "0.25.9", default-features = false, features = [
    "bmp", "gif", "ico", "jpeg", "png", "webp", "rayon",
] }

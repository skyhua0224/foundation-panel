name: lab image bench
on:
  push:
    branches: [lab/imgbench]
jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build s and z
        shell: pwsh
        run: |
          foreach ($o in "s","z") {
            $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = $o
            cargo build --release --manifest-path imgbench/Cargo.toml --target-dir "target-$o"
          }
          Remove-Item Env:CARGO_PROFILE_RELEASE_OPT_LEVEL
          Get-Item target-s/release/imgbench.exe, target-z/release/imgbench.exe | Select-Object Name,Length | Out-String | Write-Host
      - name: Run
        shell: pwsh
        run: |
          foreach ($round in 1..3) { foreach ($o in "s","z") { & "target-$o/release/imgbench.exe" $o } }
